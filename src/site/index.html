<title>Talerstolen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: sticky top bar with section tabs, one centred 1120px column. Chrome stays ink-neutral so the
   twelve party colours are the only colour on the page; a highlighter stroke marks video hooks. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#E8EAEF; --ink:#12161C; --ink-2:#434C5C; --ink-3:#6C7688; --line:#D8DCE4;
  --marker:#FFE566; --live:#D93025; --good:#15784A; --bad:#B8322B; --ring:rgb(0 0 0 / .1);
  --display:"Bricolage Grotesque","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --r-s:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1115; --surface:#161A20; --surface-2:#212730; --ink:#ECEEF2; --ink-2:#B1B9C6; --ink-3:#838C9C; --line:#2B323D;
    --marker:#6A5810; --live:#FF6B5E; --good:#52C790; --bad:#FF8177; --ring:rgb(255 255 255 / .16); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#161A20; --surface-2:#212730; --ink:#ECEEF2; --ink-2:#B1B9C6; --ink-3:#838C9C; --line:#2B323D;
  --marker:#6A5810; --live:#FF6B5E; --good:#52C790; --bad:#FF8177; --ring:rgb(255 255 255 / .16); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding-block:9px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.025em;text-decoration:none;margin-right:6px}
.brand svg{width:24px;height:24px;flex:none}
.nav{display:flex;gap:2px;flex:1 1 420px;min-width:0;overflow-x:auto;scrollbar-width:none;order:3}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.sbtn{margin-left:auto;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:14px;font-weight:500}
.sbtn kbd{font:600 11px var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--ink-3)}
@media (min-width:900px){.nav{order:0;flex:1 1 auto}.sbtn{margin-left:0}}
@media (max-width:520px){.sbtn span{display:none}.sbtn kbd{display:none}}

main{padding-block:26px 64px;min-height:70vh}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.03;letter-spacing:-.035em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:16px;font-weight:700;line-height:1.3}
h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lead{font-size:18px;line-height:1.5;color:var(--ink-2);max-width:66ch}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.prose{max-width:68ch}
.prose p+p{margin-top:.7em}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-l{display:flex;flex-direction:column;gap:30px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:26px;align-items:start}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:860px){.grid2,.grid2e{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.hr{border:0;border-top:1px solid var(--line);margin:0}
.mark{background:linear-gradient(transparent 58%,var(--marker) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
a.ext{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
a.ext:hover{text-decoration-color:currentColor}

/* party letter tile, modelled on the ballot's "Liste O" */
.pl{--pc:#888;--pt:#fff;display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:6px;background:var(--pc);color:var(--pt);font-family:var(--display);font-weight:800;font-size:15.5px;line-height:1;text-decoration:none;box-shadow:inset 0 0 0 1px var(--ring)}
.pl.s{width:21px;height:21px;font-size:12px;border-radius:5px}
.pl.l{width:44px;height:44px;font-size:25px;border-radius:9px}
.pl.xl{width:76px;height:76px;font-size:44px;border-radius:15px}
.pl.wide{width:auto;min-width:28px;padding:0 5px;font-size:10.5px;letter-spacing:.02em}
.pl.s.wide{min-width:21px;font-size:9px;padding:0 4px}
a.pl:hover{filter:brightness(1.08)}
.tiles{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle}

.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;text-decoration:none}
button.chip:hover,a.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.new{background:var(--ink);color:var(--bg)}
.tag.gov{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:650;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;margin-bottom:-1px;padding:10px 12px;font-weight:650;font-size:15px;color:var(--ink-3);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
select,input[type=text],textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:74px;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:var(--ink-2);min-width:0}

/* live status */
.live{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.live.ok .dot{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.live.ok .dot{animation:none}html{scroll-behavior:auto}}
.note{border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--ink-3);font-size:14.5px}

/* feed */
.feed-list{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:54px minmax(0,1fr);gap:4px 12px;padding:13px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi time{font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;padding-top:2px}
.fi h3{font-size:15.5px;font-weight:650}
.fi h3 a{text-decoration:none}
.fi h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.fi .meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;margin-top:5px;font-size:13px;color:var(--ink-3)}
.fi p{font-size:14.5px;color:var(--ink-2);margin-top:3px}
.vote{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px;color:var(--ink-3)}
.vote span{display:inline-flex;align-items:center;gap:5px}
.vote b{color:var(--ink);font-variant-numeric:tabular-nums}

/* hot debates + heat */
.heat{display:inline-flex;gap:2px;vertical-align:middle}
.heat i{width:4px;height:13px;border-radius:2px;background:var(--surface-2)}
.heat i.on{background:var(--ink)}
.hot li{border-top:1px solid var(--line)}
.hot li:first-child{border-top:0}
.hot a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 11px;align-items:baseline;padding:10px 0;text-decoration:none}
.hot a:hover b{text-decoration:underline;text-underline-offset:3px}
.hot b{font-weight:650;font-size:15px;line-height:1.3}
.hot small{grid-column:2;color:var(--ink-3);font-size:13px}

/* hemicycle + polls */
.hemi{display:block;width:100%;max-width:540px;height:auto;margin-inline:auto}
.hemi circle{stroke:var(--ring);stroke-width:1;transition:opacity .15s}
.hemi text{fill:var(--ink);font-family:var(--display);text-anchor:middle}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px 10px}
.legend a{display:flex;align-items:center;gap:7px;text-decoration:none;font-size:13.5px;font-weight:600;color:var(--ink-2);padding:2px;border-radius:6px}
.legend a:hover{color:var(--ink)}
.legend b{font-variant-numeric:tabular-nums;color:var(--ink)}
.blocs{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2)}
.blocs b{font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.poll{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:7px 10px;align-items:center;font-size:13.5px;font-variant-numeric:tabular-nums}
.poll .track{position:relative;height:14px;background:var(--surface-2);border-radius:3px}
.poll .bar{position:absolute;inset:0 auto 0 0;border-radius:3px;box-shadow:inset 0 0 0 1px var(--ring)}
.poll .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.poll .v{font-weight:700;text-align:right}
.poll .d{text-align:right;color:var(--ink-3);min-width:38px}
.poll .d.up{color:var(--good)} .poll .d.dn{color:var(--bad)}

/* party grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 13px;padding:15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;align-content:start}
.pcard:hover{border-color:var(--ink-3)}
.pcard .pl{grid-row:span 2}
.pcard b{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.pcard small{color:var(--ink-3);font-size:13px}
.pcard p{grid-column:1/-1;font-size:14px;color:var(--ink-2);line-height:1.4;margin-top:6px}
.pcard .row{grid-column:1/-1;margin-top:6px;gap:5px}
.quick{display:flex;flex-wrap:wrap;gap:8px}

/* party page */
.phead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;align-items:center}
.phead .pl{grid-row:span 2}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:14.5px}
.facts dt{color:var(--ink-3);font-weight:600;white-space:nowrap}
.facts dd{min-width:0;overflow-wrap:anywhere}
.issue{padding:13px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0;padding-top:4px}
.issue p{color:var(--ink-2);margin-top:3px;font-size:15px}
.voice{border-left:3px solid var(--pc,var(--ink));padding:2px 0 2px 14px}
.voice.crit{border-left-color:var(--ink-3)}
.voice p{font-size:15.5px;margin-top:6px}
.topic{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:6px 20px;padding:14px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0}
.topic p{color:var(--ink-2);font-size:15px}
.topic button{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:15.5px}
.topic button:hover{text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.topic{grid-template-columns:minmax(0,1fr)}}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.dots i.on{background:var(--pc,var(--ink));box-shadow:inset 0 0 0 1px var(--ring);width:13px;height:13px}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3);margin-top:4px}
.tl{display:grid;grid-template-columns:58px minmax(0,1fr);gap:0 14px}
.tl dt{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;padding:9px 0;border-top:1px solid var(--line)}
.tl dd{padding:9px 0;border-top:1px solid var(--line);font-size:15px;color:var(--ink-2)}
.tl dt:first-of-type,.tl dt:first-of-type+dd{border-top:0}
.person{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person small{color:var(--ink-3);font-size:13px;font-weight:600}
.person p{font-size:14.5px;color:var(--ink-2)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.pair>div{padding:14px 16px}
.pair>div+div{border-left:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.pair p{font-size:15px;margin-top:5px}
@media (max-width:640px){.pair{grid-template-columns:minmax(0,1fr)}.pair>div+div{border-left:0;border-top:1px solid var(--line)}}
.plus li,.minus li,.bul li{position:relative;padding-left:20px;font-size:15px;color:var(--ink-2);margin-top:6px}
.plus li::before{content:"+";position:absolute;left:2px;font-weight:800;color:var(--good)}
.minus li::before{content:"−";position:absolute;left:2px;font-weight:800;color:var(--bad)}
.bul li::before{content:"";position:absolute;left:5px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.vocab{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:0 16px}
.vocab dt{font-weight:700;padding:9px 0;border-top:1px solid var(--line)}
.vocab dd{padding:9px 0;border-top:1px solid var(--line);color:var(--ink-2);font-size:15px}
.vocab dt:first-of-type,.vocab dt:first-of-type+dd{border-top:0}
@media (max-width:560px){.vocab{grid-template-columns:minmax(0,1fr)}.vocab dd{border-top:0;padding-top:0}}
.members{font-size:14.5px;color:var(--ink-2);line-height:1.7}

/* accordion */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.acc+.acc{margin-top:10px}
.acc>button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;width:100%;text-align:left;background:none;border:0;padding:15px 16px;align-items:start}
.acc>button:hover h3{text-decoration:underline;text-underline-offset:3px}
.acc>button .sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:13px;color:var(--ink-3)}
.acc>button .chev{font-size:20px;line-height:1;color:var(--ink-3);transition:transform .15s}
.acc[data-open] .chev{transform:rotate(45deg)}
.acc-b{padding:2px 16px 18px;display:flex;flex-direction:column;gap:16px}
.pos{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 11px;align-items:start;font-size:14.5px}
.pos p{color:var(--ink-2)}
.pos b{color:var(--ink)}
.srcs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-3)}
.fact{font-size:14.5px;color:var(--ink-2);padding-left:14px;border-left:2px solid var(--line)}

/* compare */
.cols5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cols5>div{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 4px;min-height:92px}
.cols5 small{font-weight:700;color:var(--ink-3);font-size:12px}
.duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px) minmax(0,1fr);gap:0 16px}
.duel>*{padding:13px 0;border-top:1px solid var(--line);font-size:14.5px}
.duel .mid{text-align:center;font-weight:700;font-size:13.5px}
.duel .mid .dots{margin:5px 3px 0}
.duel p{color:var(--ink-2)}
@media (max-width:700px){.duel{grid-template-columns:minmax(0,1fr)}.duel>*{border-top:0;padding:4px 0}.duel .mid{border-top:1px solid var(--line);padding-top:14px;text-align:left}}
.coal{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:8px}
.coal button{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-weight:600;font-size:14px;text-align:left}
.coal button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.coal button b{margin-left:auto;font-variant-numeric:tabular-nums}
.coal button span:not(.pl){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{position:relative;height:30px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex}
.meter span{height:100%;box-shadow:inset -1px 0 0 var(--ring)}
.meter-line{position:relative;height:0}
.meter-line::before{content:"";position:absolute;left:calc(90 / 179 * 100%);top:-36px;height:42px;width:2px;background:var(--ink)}
.meter-line::after{content:"90";position:absolute;left:calc(90 / 179 * 100%);top:8px;transform:translateX(-50%);font-size:12px;font-weight:700}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.compass{width:100%;max-width:560px;height:auto;display:block;margin-inline:auto}
.compass line{stroke:var(--line)}
.compass .ax{fill:var(--ink-3);font:600 12px var(--body)}
.compass text.lt{font:800 14px var(--display);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.compass circle{stroke:var(--ring)}

/* video */
.idea .hook{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.6vw,26px);line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
.beats{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:7px 12px;font-size:15px;align-items:baseline}

.who{font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;white-space:nowrap;background:var(--surface-2);color:var(--ink)}
.who.df{background:#EAC73E;color:#12161C}
.who.scr{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.status{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.status button{border:0;background:none;padding:5px 11px;font-size:13px;font-weight:650;color:var(--ink-3)}
.status button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.script{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-height:120px;font-size:15.5px}
.script h4{margin:16px 0 6px}
.script h4:first-child{margin-top:0}
.script p{margin-top:5px}
.script .ln{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;align-items:baseline;margin-top:8px}
.script li{position:relative;padding-left:18px;margin-top:4px}
.script li::before{content:"";position:absolute;left:4px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hookcard{padding:14px 0;border-top:1px solid var(--line)}

.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}

.opts button:not([disabled]):hover{border-color:var(--ink)}
.opts button.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opts button.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.prog{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:min(560px,88%);padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}

.send{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}

/* career */
.paytable{width:100%;border-collapse:collapse;font-size:14.5px}
.paytable th,.paytable td{text-align:left;padding:10px 12px 10px 0;border-top:1px solid var(--line);vertical-align:top}
.paytable th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);border-top:0}
.paytable td:nth-child(2){font-weight:700;white-space:nowrap}
.scrollx{overflow-x:auto}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}

.foot{padding-block:22px 40px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:90}

<script src="data.js"></script>
<script>
(() => {
'use strict';
const T = window.TS;
const view = document.getElementById('view');
document.documentElement.lang = 'da';
/* HOSTED: siden kører som Claude-artifact (database + Claude). Ellers er den en selvstændig hjemmeside, der læser live/*.json. */
const HOSTED = !!(window.claude && typeof window.claude.use === 'function');
const HASAI = HOSTED;
const SITE = Object.assign({ video: true, career: true, bank: true }, window.TS_SITE || {});
if (!T) { view.innerHTML = '<p class="note">Siden kunne ikke indlæse sine data. Prøv at genindlæse.</p>'; return; }

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => { u = String(u || ''); return /^https:\/\/[^\s"'<>]+$/i.test(u) ? u : ''; };
const ext = (u, text) => { const h = safeUrl(u); return h ? `<a class="ext" href="${esc(h)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text); };
const arr = x => Array.isArray(x) ? x : [];
const MON = ['jan.', 'feb.', 'mar.', 'apr.', 'maj', 'juni', 'juli', 'aug.', 'sep.', 'okt.', 'nov.', 'dec.'];
const MONL = ['januar', 'februar', 'marts', 'april', 'maj', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'december'];
const DAYS = ['søndag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lørdag'];
const dparse = s => { if (!s) return null; s = String(s); const d = new Date(s.length <= 10 ? s + 'T12:00:00' : s); return isNaN(d) ? null : d; };
const dshort = s => { const d = dparse(s); return d ? d.getDate() + '. ' + MON[d.getMonth()] : ''; };
const dlong = s => { const d = dparse(s); return d ? d.getDate() + '. ' + MONL[d.getMonth()] + ' ' + d.getFullYear() : ''; };
const ago = s => { const d = dparse(s); if (!d) return ''; const m = (Date.now() - d) / 60000; if (m < 2) return 'lige nu'; if (m < 60) return 'for ' + Math.round(m) + ' min. siden'; const h = m / 60; if (h < 24) return 'for ' + Math.round(h) + ' t. siden'; const dd = h / 24; if (dd < 2) return 'i går'; if (dd < 14) return 'for ' + Math.round(dd) + ' dage siden'; return dshort(s); };
const num = (n, dec) => (typeof n === 'number' && isFinite(n)) ? n.toLocaleString('da-DK', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }) : '–';
const om = t => { t = String(t || '').replace(/^Om,?\s+/i, '').replace(/\.$/, ''); return t.charAt(0).toUpperCase() + t.slice(1); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k, d) { try { const v = localStorage.getItem('ts.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('ts.' + k, JSON.stringify(v)); } catch (e) { } } };

const P = {}; T.parties.forEach(p => { P[p.id] = p; });
const ORDER = T.parties.slice().sort((a, b) => a.order - b.order);
const PS = T.pseudo || {};
const TOP = {}; T.topics.forEach(t => { TOP[t.id] = t; });
const GOV = new Set(T.government.parties), SUP = new Set(T.government.support);
const meta = id => P[id] || PS[id] || null;
const topicName = id => (TOP[id] && TOP[id].name) || 'Andet';
const roleOf = id => GOV.has(id) ? 'Regering' : SUP.has(id) ? 'Støtteparti' : 'Opposition';
function tile(id, size, noLink) {
  const p = meta(id); if (!p) return '';
  const cls = 'pl ' + (size || '') + (p.letter.length > 1 ? ' wide' : '');
  const st = `--pc:${p.color};--pt:${p.on}`;
  return P[id] && !noLink
    ? `<a class="${cls}" style="${st}" href="#parti-${id}" title="${esc(p.name)}" aria-label="${esc(p.name)}">${esc(p.letter)}</a>`
    : `<span class="${cls}" style="${st}" title="${esc(p.name)}">${esc(p.letter)}</span>`;
}
const tiles = (ids, size) => `<span class="tiles">${arr(ids).filter(meta).map(i => tile(i, size || 's')).join('')}</span>`;
const dots = (score, color) => `<span class="dots" style="--pc:${color || 'var(--ink)'}" role="img" aria-label="${score} af 5">${[1, 2, 3, 4, 5].map(i => `<i${i === score ? ' class="on"' : ''}></i>`).join('')}</span>`;
const heat = n => `<span class="heat" role="img" aria-label="Fylder ${n} af 5">${[1, 2, 3, 4, 5].map(i => `<i${i <= n ? ' class="on"' : ''}></i>`).join('')}</span>`;
const srcs = list => { const l = arr(list).filter(s => s && safeUrl(s.url)); return l.length ? `<p class="srcs"><span>Kilder:</span>${l.map(s => ext(s.url, s.title || 'kilde')).join('')}</p>` : ''; };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
async function copyText(text) { try { await navigator.clipboard.writeText(text); toast('Kopieret'); } catch (e) { toast('Kunne ikke kopiere. Markér teksten og kopiér selv.'); } }

/* ---------- state ---------- */
const VIEWS = [['i-dag', 'I dag'], ['partier', 'Partier'], ['sammenlign', 'Sammenlign'], ['debatter', 'Debatter'], ['video', 'Video'], ['traen', 'Træn'], ['vejen', 'Vejen ind']].filter(v => (v[0] !== 'video' || SITE.video) && (v[0] !== 'vejen' || SITE.career));
const S = {
  route: 'i-dag', party: null, ptab: 'overblik', open: new Set(), feedKind: 'alle', feedParty: 'alle', feedN: 12,
  psort: 'fløj', cmp: 'emne', cmpTopic: 'udlaendinge', a: 'df', b: 's', coal: new Set(T.government.parties),
  debTopic: 'alle', debParty: 'alle', vtab: 'ideer', ttab: 'quiz', busy: false, pending: false,
  gen: { src: '', custom: '', person: 'Studerende', len: '45', tone: 'Skarp men fair', win: 'Uafgjort, seeren dømmer', text: '', err: '' },
  quiz: null, spar: { me: 'df', opp: 's', topic: 'udlaendinge', turns: [], err: '' }, ask: {}, checks: {}
};
const L = { status: 'loading', meta: null, ft: null, national: null, partydebates: null, news: null, videos: null };
const My = { data: { status: {}, scripts: [], quiz: { best: 0, rounds: 0, wrong: {} } }, ref: null, saving: false, dirty: false };
const prevVisit = store.get('visit', null);
store.set('visit', new Date().toISOString().slice(0, 10));
Object.assign(My.data, store.get('my', {}));

const seatsNow = () => (L.ft && L.ft.seats && Object.keys(L.ft.seats).length > 5) ? L.ft.seats : Object.fromEntries(Object.entries(T.election.results).map(([k, v]) => [k, v.seats]).concat([['na', 4]]));
const seatOf = id => seatsNow()[id] || 0;
const latestPoll = () => { const l = L.meta && L.meta.polls && arr(L.meta.polls.latest); return l && l.length ? l[0] : null; };
const nat = () => arr(L.national && L.national.items);
const pdeb = () => arr(L.partydebates && L.partydebates.items);
const vids = () => arr(L.videos && L.videos.items);

/* ---------- live status ---------- */
function liveBadge() {
  const up = L.meta && L.meta.updatedAt;
  if (L.status === 'ok' && up) return `<span class="live ok" title="Seneste opdatering: ${esc(dlong(up))}"><i class="dot"></i>Opdateret ${esc(ago(up))}</span>`;
  if (L.status === 'loading') return `<span class="live"><i class="dot"></i>Henter det nyeste …</span>`;
  if (L.status === 'slow') return `<span class="live"><i class="dot"></i>Forbindelsen er langsom. Prøver stadig …</span>`;
  if (L.status === 'empty') return `<span class="live"><i class="dot"></i>Venter på første opdatering</span>`;
  return `<span class="live"><i class="dot"></i>${HOSTED ? 'Live-data vises kun, når du er logget ind på claude.ai' : 'Live-data kunne ikke hentes lige nu'}</span>`;
}
function liveNote(what) {
  if (L.status === 'loading' || L.status === 'slow') return `<p class="note">Henter ${esc(what)} …</p>`;
  if (L.status === 'off') return `<p class="note">${esc(what.charAt(0).toUpperCase() + what.slice(1))} ${HOSTED ? 'hentes live og kan ikke vises i denne visning. Åbn siden logget ind på claude.ai.' : 'kunne ikke hentes lige nu. Prøv at genindlæse siden.'}</p>`;
  return `<p class="note">Der er ikke kommet ${esc(what)} ind endnu. De dukker op her ved næste opdatering.</p>`;
}

/* ---------- feed ---------- */
function feedItems() {
  const out = [];
  arr(L.news && L.news.items).forEach(n => out.push({ kind: 'nyhed', date: n.date, parties: arr(n.parties), title: n.title, text: n.text, url: n.url, source: n.source }));
  if (L.ft) {
    arr(L.ft.votes).forEach(v => out.push({ kind: 'afstemning', date: v.date, parties: [].concat(arr(v.for), arr(v.against), arr(v.abstain)), v }));
    arr(L.ft.proposals).forEach(p => out.push({ kind: 'forslag', date: p.date, parties: arr(p.parties), p }));
    arr(L.ft.questions).forEach(q => out.push({ kind: 'spørgsmål', date: q.date, parties: arr(q.parties), q }));
  }
  const rank = { nyhed: 0, afstemning: 1, forslag: 2, 'spørgsmål': 3 };
  return out.sort((a, b) => String(b.date).localeCompare(String(a.date)) || rank[a.kind] - rank[b.kind]);
}
function feedRow(it) {
  const isNew = prevVisit && it.date && it.date > prevVisit;
  const badge = isNew ? '<span class="tag new">Ny</span>' : '';
  let body = '';
  if (it.kind === 'nyhed') {
    body = `<h3>${safeUrl(it.url) ? `<a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">${esc(it.title)}</a>` : esc(it.title)}</h3>${it.text ? `<p>${esc(it.text)}</p>` : ''}
      <div class="meta">${badge}${tiles(it.parties)}<span>${esc(it.source || 'Nyhed')}</span></div>`;
  } else if (it.kind === 'afstemning') {
    const v = it.v;
    body = `<h3><a href="${esc(safeUrl(v.url))}" target="_blank" rel="noopener">${v.passed ? 'Vedtaget' : 'Forkastet'}: ${esc(om(v.title))}</a></h3>
      <div class="vote"><span><b>${v.forN}</b> for ${tiles(v.for)}</span><span><b>${v.againstN}</b> imod ${tiles(v.against)}</span>${v.abstainN ? `<span><b>${v.abstainN}</b> hverken/eller ${tiles(v.abstain)}</span>` : ''}</div>
      <div class="meta">${badge}<span class="tag">Afstemning</span><span>${esc(v.nr)} · ${esc(v.step)}</span></div>`;
  } else if (it.kind === 'forslag') {
    const p = it.p;
    body = `<h3><a href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener">${esc(om(p.title))}</a></h3>
      <div class="meta">${badge}<span class="tag">${esc(p.kind)}</span>${p.gov ? '<span>Regeringen</span>' : tiles(p.parties)}<span>${esc(p.nr)}${p.by && !p.gov ? ' · ' + esc(p.by) : ''}${p.status ? ' · ' + esc(p.status) : ''}</span></div>`;
  } else {
    const q = it.q;
    body = `<h3><a href="${esc(safeUrl(q.url))}" target="_blank" rel="noopener">${esc(q.long || q.title)}</a></h3>
      <div class="meta">${badge}<span class="tag">Spørgsmål</span>${tiles(q.parties)}<span>${esc(q.by)} til ${esc(q.to)}</span></div>`;
  }
  return `<li class="fi"><time datetime="${esc(it.date)}">${esc(dshort(it.date))}</time><div>${body}</div></li>`;
}
function feedPanel(fixedParty) {
  const kinds = fixedParty ? [['alle', 'Alt'], ['afstemning', 'Afstemninger'], ['forslag', 'Forslag'], ['spørgsmål', 'Spørgsmål']] : [['alle', 'Alt'], ['nyhed', 'Nyheder'], ['afstemning', 'Afstemninger'], ['forslag', 'Forslag'], ['spørgsmål', 'Spørgsmål']];
  let items = feedItems();
  if (fixedParty) items = items.filter(i => i.kind !== 'nyhed');
  const party = fixedParty || S.feedParty;
  if (party !== 'alle') items = items.filter(i => i.parties.includes(party));
  items = S.feedKind === 'alle' ? items.filter(i => i.kind !== 'spørgsmål' || fixedParty) : items.filter(i => i.kind === S.feedKind);
  const shown = items.slice(0, S.feedN);
  const list = shown.length ? `<ul class="feed-list">${shown.map(feedRow).join('')}</ul>${items.length > shown.length ? `<button class="btn ghost sm" data-act="feed-more" type="button">Vis flere (${items.length - shown.length})</button>` : ''}`
    : (L.news || L.ft ? `<p class="note">Intet at vise med det filter.</p>` : liveNote('nyheder og afstemninger'));
  return `<div class="stack">
    <div class="chips scroll" role="group" aria-label="Type">${kinds.map(([k, n]) => `<button class="chip" type="button" data-act="feed-kind" data-v="${k}" aria-pressed="${S.feedKind === k}">${n}</button>`).join('')}</div>
    ${fixedParty ? '' : `<div class="row" role="group" aria-label="Parti"><button class="chip" type="button" data-act="feed-party" data-v="alle" aria-pressed="${S.feedParty === 'alle'}">Alle partier</button>${ORDER.map(p => `<button type="button" class="pl" style="--pc:${p.color};--pt:${p.on};border:0;${S.feedParty === p.id ? 'outline:2px solid var(--ink);outline-offset:2px' : (S.feedParty !== 'alle' ? 'opacity:.4' : '')}" data-act="feed-party" data-v="${p.id}" title="${esc(p.name)}" aria-label="${esc(p.name)}" aria-pressed="${S.feedParty === p.id}">${esc(p.letter)}</button>`).join('')}</div>`}
    ${list}</div>`;
}

/* ---------- hemicycle + polls ---------- */
const SEATORDER = ['el', 'sf', 'alt', 's', 'rv', 'm', 'na', 'k', 'v', 'la', 'dd', 'df', 'bp', 'ufg'];
function hemicycle() {
  const seats = seatsNow();
  const total = SEATORDER.reduce((n, k) => n + (seats[k] || 0), 0);
  const radii = [0, 1, 2, 3, 4, 5, 6].map(i => 96 + i * 26), sumR = radii.reduce((a, b) => a + b, 0);
  const counts = radii.map(r => Math.round(total * r / sumR));
  let diff = total - counts.reduce((a, b) => a + b, 0);
  for (let i = radii.length - 1; diff !== 0; i = (i - 1 + radii.length) % radii.length) { counts[i] += Math.sign(diff); diff -= Math.sign(diff); }
  const pts = [];
  radii.forEach((r, i) => { const n = counts[i]; for (let j = 0; j < n; j++) { const a = Math.PI - (n === 1 ? Math.PI / 2 : j * Math.PI / (n - 1)); pts.push({ a, r: i, x: 270 + r * Math.cos(a), y: 262 - r * Math.sin(a) }); } });
  pts.sort((p, q) => q.a - p.a || p.r - q.r);
  let k = 0; const out = [];
  SEATORDER.forEach(id => { const m = meta(id); for (let i = 0; i < (seats[id] || 0); i++) { const p = pts[k++]; if (p && m) out.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8.6" fill="${m.color}" data-p="${id}"><title>${esc(m.name)}</title></circle>`); } });
  return `<svg class="hemi" id="hemi" viewBox="0 0 540 276" role="img" aria-label="Folketingets ${total} pladser fordelt på partier">${out.join('')}<text x="270" y="236" font-size="46" font-weight="800">${total}</text><text x="270" y="257" font-size="12.5" font-weight="600" style="font-family:var(--body);fill:var(--ink-3)">pladser · 90 giver flertal</text></svg>`;
}
function salen() {
  const seats = seatsNow();
  const sum = ids => ids.reduce((n, i) => n + (seats[i] || 0), 0);
  const gov = sum([...GOV]), sup = sum([...SUP]), opp = sum(ORDER.filter(p => !GOV.has(p.id) && !SUP.has(p.id)).map(p => p.id));
  const fromLive = L.ft && L.ft.seats;
  return `<div class="stack">
    <div class="between"><h2>Salen lige nu</h2><span class="small muted">${fromLive ? 'Folketingets egne tal, ' + esc(ago(L.ft.updatedAt)) : 'Valgresultatet 24. marts 2026'}</span></div>
    ${hemicycle()}
    <div class="blocs"><span><b>${gov}</b>regering</span><span><b>${sup}</b>støttepartier</span><span><b>${opp}</b>opposition</span><span><b>${(seats.na || 0)}</b>nordatlantiske</span>${seats.ufg ? `<span><b>${seats.ufg}</b>løsgængere</span>` : ''}</div>
    <div class="legend" id="legend">${ORDER.map(p => `<a href="#parti-${p.id}" data-hl="${p.id}">${tile(p.id, 's', true)}<span>${esc(p.short)}</span><b>${seats[p.id] || 0}</b></a>`).join('')}</div>
  </div>`;
}
function polls() {
  const poll = latestPoll();
  const res = T.election.results;
  const rows = T.parties.map(p => ({ p, e: res[p.id].pct, v: poll && poll.numbers ? poll.numbers[p.id] : null })).sort((a, b) => (b.v == null ? b.e : b.v) - (a.v == null ? a.e : a.v));
  const max = Math.max(24, ...rows.map(r => Math.max(r.e, r.v || 0))) + 1;
  return `<div class="stack">
    <div class="between"><h2>Målingerne</h2><span class="small muted">${poll ? esc(poll.institute) + ', ' + esc(dshort(poll.date)) : 'Valgresultat'}</span></div>
    <div class="poll">${rows.map(r => { const val = r.v == null ? r.e : r.v, d = r.v == null ? null : r.v - r.e; return `${tile(r.p.id, 's')}<div class="track" title="${esc(r.p.name)}"><div class="bar" style="width:${(val / max * 100).toFixed(1)}%;background:${r.p.color}"></div><div class="tick" style="left:${(r.e / max * 100).toFixed(1)}%" title="Valget: ${num(r.e, 1)} %"></div></div><span class="v">${num(val, 1)} %</span><span class="d ${d == null ? '' : d > 0.05 ? 'up' : d < -0.05 ? 'dn' : ''}">${d == null ? '' : (d > 0 ? '+' : '') + num(d, 1)}</span>`; }).join('')}</div>
    <p class="small muted">Søjlen er ${poll ? 'seneste måling' : 'valgresultatet'}. Den sorte streg er valget 24. marts 2026${poll ? ', og tallet til højre er ændringen siden' : ''}.${L.meta && L.meta.polls && L.meta.polls.note ? ' ' + esc(L.meta.polls.note) : ''}</p>
  </div>`;
}

/* ---------- view: parti ---------- */
function agreeWith(id) {
  const votes = arr(L.ft && L.ft.votes); if (votes.length < 5) return null;
  const side = (v, p) => arr(v.for).includes(p) ? 1 : arr(v.against).includes(p) ? -1 : arr(v.abstain).includes(p) ? 0 : null;
  return T.parties.filter(q => q.id !== id).map(q => { let n = 0, same = 0; votes.forEach(v => { const a = side(v, id), b = side(v, q.id); if (a != null && b != null) { n++; if (a === b) same++; } }); return { id: q.id, n, pct: n ? Math.round(same / n * 100) : null }; }).filter(x => x.n >= 5).sort((a, b) => b.pct - a.pct);
}

    ${open ? `<div class="acc-b"><p class="prose">${esc(d.summary)}</p>

    if (k === 'leader' && p.leader) return { party: p.id, q: `Hvem står i spidsen for ${p.name}?`, o: shuffle([{ l: p.leader.name, ok: true }].concat(others(3).map(w => ({ l: w.leader.name })))), why: `${p.leader.name} er ${(p.leader.title || 'leder').toLowerCase()}${p.leader.since ? ' siden ' + p.leader.since : ''}.` };

function sparRules() {
  const sp = S.spar, t = sp.topic, me = sp.me === 'df' ? "en DF'er" : 'en kritisk person, som er uenig med Dansk Folkeparti';
  const you = sp.me === 'df' ? `en vælger, der stemmer ${P[sp.opp].name}, og som argumenterer ud fra det partis holdninger` : "en dygtig DF'er, der argumenterer ud fra Dansk Folkepartis faktiske politik";
  const bg = sp.me === 'df' ? partyBrief(P[sp.opp], t) + '\n\nBRUGERENS SIDE (DF):\n' + dfLine(t) : dfLine(t);
  return `Du er sparringspartner i en debatøvelse på dansk. Brugeren spiller ${me}. Du spiller ${you}. Emne: ${topicName(t)}.
Svar HVER gang i præcis dette format:
Din replik i rollen: 2-4 sætninger, mundret, skarp og saglig. Slut gerne med et modspørgsmål.
---
TRÆNER: 1-2 sætninger uden for rollen om brugerens seneste replik: hvad var stærkt, hvad var svagt, og ét konkret råd. Ret faktuelle fejl, hvis brugeren sagde noget, der ikke passer med baggrunden.
REGLER: Opfind ikke tal eller citater. Hold dig til baggrunden. Ingen nedladende tale om grupper af mennesker. Når brugeren skriver "start", åbner du debatten med din første replik og udelader TRÆNER-linjen.
BAGGRUND FOR DIN ROLLE:
${bg}`;
}
async function sparSend(text, hidden) {
  const sp = S.spar; sp.err = ''; sp.turns.push({ role: 'user', content: text, hidden: !!hidden }); S.busy = true; render(true);
  const live = () => document.getElementById('sparlive');
  const turns = [{ role: 'user', content: sparRules() }].concat(sp.turns.slice(-14).map(t => ({ role: t.role, content: t.content })));
  try {
    const r = await aiCall(turns, { cache: false, onText: ({ text }) => { const o = live(); if (o) o.textContent = text.split(/\n-{3,}/)[0]; } });
    sp.turns.push({ role: 'assistant', content: r.text });
  } catch (e) { sp.turns.pop(); sp.err = e && e.code === 'unavailable' ? 'Sparring virker, når du åbner siden logget ind på claude.ai.' : aiErr(e); }
  S.busy = false; render(true);
  const c = document.getElementById('sparmsg'); if (c) c.focus();
}

function flush() { if (S.pending) refresh(); }
function refresh() {
  const el = document.activeElement, typing = el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== 'checkbox' && view.contains(el);

function route() {
  const h = (location.hash || '').slice(1);

}
function go(hash) { if (location.hash === '#' + hash) route(); else location.hash = hash; }

    case 'open-idea': S.open.add('v-' + v); S.vtab = 'ideer'; S.scrollTo = 'acc-v-' + v; go('video'); break;

    case 'idea-gen': { const i = vids().find(x => x.id === v); if (i) { S.gen.src = i.debateRef && sourceBrief(i.debateRef) ? i.debateRef : ''; S.gen.custom = `${i.title}. Hook: ${i.hook} Vinkel: ${i.angle || ''}`; if (i.person) S.gen.person = S.gen.person; S.gen.text = ''; S.gen.err = ''; S.vtab = 'manus'; render(false); } break; }
    case 'spar-on': { const src = sourceBrief(v); if (src && TOP[src.topic]) S.spar.topic = src.topic; S.spar.turns = []; S.ttab = 'sparring'; go('traen'); break; }
    case 'spar-party': S.spar.me = 'df'; S.spar.opp = v; S.spar.turns = []; S.ttab = 'sparring'; go('traen'); break;
    case 'vtab': S.vtab = v; render(true); break;
    case 'ttab': S.ttab = v; render(true); break;
    case 'vstatus': My.data.status[v] = b.dataset.s; saveMy(); render(true); break;
    case 'copy-idea': { const i = vids().find(x => x.id === v); if (i) copyText(`${i.title}\n\nHOOK: ${i.hook}\n\n${arr(i.beats).map(x => `${x.t} ${x.who}: ${x.line}`).join('\n')}\n\nCAPTION: ${i.caption || ''} ${arr(i.hashtags).join(' ')}\n\nKILDER:\n${arr(i.facts).map(f => '- ' + f.fact + (f.source ? ' (' + f.source.url + ')' : '')).join('\n')}`); break; }
    case 'check': S.checks[v] = b.checked; break;
    case 'gen-run': runGen(); break;
    case 'gen-stop': if (genCtl) genCtl.abort(); break;
    case 'gen-copy': copyText(S.gen.text); break;
    case 'gen-save': { const src = sourceBrief(S.gen.src); My.data.scripts = [{ title: (src ? src.title : (S.gen.custom || 'Manus')).slice(0, 90), date: new Date().toISOString().slice(0, 10), text: S.gen.text.slice(0, 7000) }].concat(arr(My.data.scripts)).slice(0, 20); saveMy(); toast('Gemt under Mine manus'); render(true); break; }
    case 'ms-copy': copyText(My.data.scripts[+v].text); break;
    case 'ms-del': My.data.scripts.splice(+v, 1); S.open.delete('ms-' + v); saveMy(); render(true); break;
    case 'quiz-pick': { const z = S.quiz; if (z.picked != null) break; z.picked = +v; const ok = !!z.cur.o[+v].ok; if (ok) z.score++; else { z.missed.push(z.cur.party); const mq = My.data.quiz = My.data.quiz || { best: 0, rounds: 0, wrong: {} }; mq.wrong = mq.wrong || {}; mq.wrong[z.cur.party] = (mq.wrong[z.cur.party] || 0) + 1; } render(true); break; }

    case 'quiz-new': newQuiz(); render(true); break;
    case 'spar-start': S.spar.turns = []; sparSend('start', true); break;
    case 'spar-reset': S.spar.turns = []; S.spar.err = ''; render(true); break;
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sbox.hidden) sclose(); else if (e.key === '/' && sbox.hidden && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) { e.preventDefault(); sopen(); } });

/* ---------- footer + boot ---------- */
document.getElementById('foot').innerHTML = `<p>Talerstolen samler partiernes politik, Folketingets egne data og aktuelle debatter ét sted. Skalaerne fra 1 til 5 er en forenklet vurdering og erstatter ikke partiernes egne ord. Afstemninger, forslag og mandater kommer fra ${ext('https://www.ft.dk/da/dokumenter/aabne_data', 'Folketingets åbne data')}. Partiprofilerne er skrevet ${esc(dlong(T.built))} og bygger på de kilder, der står nederst på hver side. ${SITE.video ? 'Tjek altid tal mod kilden, før du bruger dem i en video.' : 'Tjek altid tal mod kilden, før du bruger dem.'}${HOSTED ? '' : ' Talerstolen er et privat projekt og er ikke tilknyttet noget parti.'}</p>`;
route();

(async function boot() {
  const c = window.claude;
  if (!HOSTED) {
    AI.fn = null;
    const names = ['meta', 'ft', 'national', 'partydebates', 'news'].concat(SITE.video ? ['videos'] : []);
    const stamp = new Date().toISOString().slice(0, 13);
    const res = await Promise.all(names.map(n => fetch('live/' + n + '.json?h=' + stamp).then(r => r.ok ? r.json() : null).catch(() => null)));
    names.forEach((n, i) => { if (res[i]) L[n] = res[i]; });
    L.status = res.some(Boolean) ? 'ok' : 'off'; refresh(); return;
  }
  AI.ready = c.use('sample').then(fn => { AI.fn = fn || null; if (!fn) refresh(); }).catch(() => { AI.fn = null; });
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { }
  if (!db) { L.status = 'off'; refresh(); return; }
  const timer = setTimeout(() => { if (L.status === 'loading') { L.status = 'slow'; refresh(); } }, 10000);
  try {
    db.collection('live').onSnapshot(snap => {
      snap.docs.forEach(d => { if (d.id in L && d.id !== 'status') L[d.id] = d.data(); });
      if (!snap.metadata || !snap.metadata.fromCache) clearTimeout(timer);
      L.status = snap.empty ? 'empty' : 'ok'; refresh();
    }, () => { clearTimeout(timer); L.status = 'off'; refresh(); });
  } catch (e) { clearTimeout(timer); L.status = 'off'; refresh(); }
  try {
    const id = user && await user.id();
    if (id) {
      My.ref = db.doc('data/users/' + id + '/state');
      const s = await My.ref.get();
      if (s.exists) { const d = s.data(); My.data = { status: Object.assign({}, My.data.status, d.status), scripts: arr(d.scripts).length ? arr(d.scripts).slice() : My.data.scripts, quiz: Object.assign({ best: 0, rounds: 0, wrong: {} }, My.data.quiz, d.quiz) }; refresh(); }
    }
  } catch (e) { My.ref = null; }
})();
})();
</script>
